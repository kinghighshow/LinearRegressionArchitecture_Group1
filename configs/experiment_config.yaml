data:
  csv:
    california: data/raw/california_housing.csv
    toronto: data/raw/toronto_property_prices.csv
  # Robot pipeline's data source (separate keys, same "data" block is fine
  # since the key names don't overlap):
  source_type: csv           # "csv" or "database"
  csv_path: data/raw/robot_data.csv

api:                          # housing: California open-data API
  url: "https://data.ca.gov/api/action/datastore_search"
  params:
    resource_id: "fe505d9b-8c36-42ba-ba30-08bc4f34e022"
    limit: 100
  record_path: "result.records"

database:                     # housing: SQLite demo source
  path: data/housing_data.sqlite
  query: "SELECT * FROM california_housing;"

modeling:                     # housing: predictor/target
  feature: median_income
  target: median_house_value

# ---- Robot pipeline: labeling ---------------------------------------
labeling:
  running_threshold: 0.5      # Total current above which the robot is RUNNING
  baseline_fraction: 0.4      # fraction of data used to fit per-axis normal limits
  rolling_window: 5           # rolling mean/std window (readings) per axis

# ---- Housing pipeline: hyperparameters -------------------------------
training:
  test_size: 0.2
  random_state: 42
  learning_rate: 0.01
  iterations: 1000

# ---- Robot pipeline: hyperparameters (kept separate - see config.py) --
robot_training:
  test_size: 0.2
  learning_rate: 0.1
  iterations: 2000

model:                        # robot: classifier selection
  candidates: ["scratch", "sklearn"]
  class_weight: "balanced"    # at_risk readings are rare - don't ignore them
  threshold: 0.5               # decision threshold applied to the confidence score
  artifact_path: models/robot_failure_model.joblib

# ---- Experiment tracking: one CSV per pipeline -----------------------
experiment_tracking:
  results_path: experiments/housing_results.csv
  robot_results_path: experiments/robot_results.csv
